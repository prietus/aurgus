[package]
name = "aurgus"
version = "0.1.0"
edition = "2024"
description = "An AUR helper that audits PKGBUILDs before building them"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
flate2 = "1"
libc = "0.2.191"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
